# DocBrisk SEO Worker (docbrisk-seo repo) - Cloudflare config
#
# Replaces the older file that routed only /tool/*, /about, /pricing,
# /privacy, /terms, /sitemap.xml and /robots.txt here. Since SEO Worker v4
# this Worker serves the WHOLE site: every page, /sw.js (with the ad code),
# /manifest.webmanifest, static files from the My-website repo, the Excel
# add-ins pages, downloads and the /addins-api/ endpoints. Any path not routed
# here falls through to the other Worker, which has none of that, so the
# add-ins admin page and the request form cannot work with the old routes.
#
# A Route takes priority over a Custom Domain on the same hostname, so
# docbrisk.com/* below wins over the Worker that holds docbrisk.com as its
# Custom Domain. Keep that Custom Domain; it is harmless.
#
# Before committing this file:
#   1. Create the R2 bucket "docbrisk-addins" (R2 Object Storage -> Create
#      bucket). Deploys FAIL if the bucket named below does not exist.
#   2. If another Worker has a ROUTE (not a Custom Domain) "docbrisk.com/*",
#      delete that route first (that Worker -> Settings -> Domains & Routes),
#      or this deploy fails with "route already assigned".
#
# Secrets are set in the dashboard, never here, and GitHub deploys keep them:
#   docbrisk-seo -> Settings -> Variables and Secrets -> Add -> type Secret
#     ADDINS_ADMIN_KEY   24+ random characters (you may reuse your ADMIN_KEY value)

name = "docbrisk-seo"
main = "seo-worker.js"
compatibility_date = "2024-11-01"

[[routes]]
pattern = "docbrisk.com/*"
zone_name = "docbrisk.com"

# Uncomment only if a proxied DNS record for "www" exists (DNS -> Records).
# The Worker then 301-redirects www.docbrisk.com to docbrisk.com.
# [[routes]]
# pattern = "www.docbrisk.com/*"
# zone_name = "docbrisk.com"

[[r2_buckets]]
binding = "ADDINS"
bucket_name = "docbrisk-addins"
